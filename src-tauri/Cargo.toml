[package]
name = "posterclub-app"
version = "0.1.0"
description = "Posterclub - gestione magazzino e pubblicazione multi-portale"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-shell = "2"
tokio = { version = "1", features = ["net", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "posterclub-app"
path = "src/main.rs"
