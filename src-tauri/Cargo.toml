[package]
name = "posterclub-app"
version = "0.1.0"
description = "Posterclub - gestione magazzino e pubblicazione multi-portale"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "~2.11", features = [] }
tauri-plugin-updater = "~2.12"
tauri-plugin-process = "~2.3"
tauri-plugin-shell = "2"
tokio = { version = "1", features = ["net", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "posterclub-app"
path = "src/main.rs"

# zip: tutte le versioni su crates.io (tranne la 9.x, incompatibile con
# tauri-plugin-updater) sono state ritirate ("yanked") nell'ottobre 2026.
# Si usa lo stesso codice direttamente dal repository ufficiale.
[patch.crates-io]
zip = { git = "https://github.com/zip-rs/zip2", tag = "v4.6.1" }
